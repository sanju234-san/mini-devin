name: CI

on: [push, pull_request]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
